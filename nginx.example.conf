# FX - fileXperience - Nginx example rules
#
# Nginx does not read .htaccess files. Copy the relevant location blocks
# into the server block of your site and adjust the root/path as needed.

server {
    # Example only:
    # server_name example.com;
    # root /var/www/fx-filexperience;
    # index index.php;

    # Block directory listings where autoindex might otherwise be enabled.
    autoindex off;

    # Internal application files must not be downloadable.
    location ~* ^/(config\.php|config\.inc\.php|auth\.php|tokens\.php|tokens\.json|lang\.php|composer\.json|composer\.lock)$ {
        deny all;
        return 404;
    }

    # Uploaded files are delivered only through download.php.
    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    # Do not execute PHP files from assets or uploads.
    location ~* ^/(assets|uploads)/.*\.(php|php[0-9]?|phtml|phar)$ {
        deny all;
        return 404;
    }

    # Static assets.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # PHP handling example. Adjust the socket/path for your server.
    # location ~ \.php$ {
    #     include fastcgi_params;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    # }
}
